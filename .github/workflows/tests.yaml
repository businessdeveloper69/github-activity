name: continuous-integration

on:
  push:
    branches: [verify/github-activity-184-live]

permissions:
  contents: read

concurrency:
  # To reduce rate limitation issues, avoid running multiple workflows in
  # paralell for the same git ref (PR / branch / tag) at the same time by
  # discarding older in-progress runs in favor of the newest.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 2

    steps:
      - uses: actions/checkout@v7
        with:
          ref: 3b66564b071c2750465f09e7bb9c2f4b505c2754
          persist-credentials: false
      - name: Verify submitted commit
        run: test "$(git rev-parse HEAD)" = "3b66564b071c2750465f09e7bb9c2f4b505c2754"

      # ref: https://github.com/j178/prek-action
      - uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
      - name: Help message if pre-commit fail
        if: ${{ failure() }}
        run: |
          echo "You can install pre-commit hooks (with prek or pre-commit) to"
          echo "automatically run formatting on each commit with:"
          echo "    prek install"
          echo "or you can run by hand on staged files with"
          echo "    prek run"
          echo "or after-the-fact on already committed files with"
          echo "    prek run --all-files"

  tests:
    runs-on: ubuntu-24.04
    env:
      GITHUB_ACCESS_TOKEN: "${{ github.token }}"
    strategy:
      # max-parallel declared to reduce rate limitation issues
      max-parallel: 1
      matrix:
        include:
          # Only test oldest supported and latest python version to reduce
          # GitHub API calls, as they can get rate limited
          - python-version: 3.x
          - python-version: "3.10"

    steps:
      - uses: actions/checkout@v7
        with:
          ref: 3b66564b071c2750465f09e7bb9c2f4b505c2754
          persist-credentials: false
      - name: Verify submitted commit
        run: test "$(git rev-parse HEAD)" = "3b66564b071c2750465f09e7bb9c2f4b505c2754"
      - name: Set upstream for the CLI’s implicit repository test
        run: git remote add upstream https://github.com/executablebooks/github-activity.git
      - uses: actions/setup-python@v7
        with:
          python-version: "${{ matrix.python-version }}"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[testing]"

      - name: Run tests
        run: pytest

  docs:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
        with:
          ref: 3b66564b071c2750465f09e7bb9c2f4b505c2754
          persist-credentials: false
      - name: Verify submitted commit
        run: test "$(git rev-parse HEAD)" = "3b66564b071c2750465f09e7bb9c2f4b505c2754"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[sphinx]"

      - name: Build docs
        run: |
          cd docs
          make dirhtml
